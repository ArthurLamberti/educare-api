name: CI

# main: build, tests and image (`latest`). staging: the same, with image `staging`, and deploy to the VPS.
on:
  push:
    branches: [main, staging]
  pull_request:

env:
  # GHCR requires lowercase names
  IMAGE_NAME: ghcr.io/arthurlamberti/educare-api

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Integration tests use Testcontainers (PostgreSQL); Docker is available on the runner
      - name: Build and tests
        run: ./gradlew build --no-daemon

      - name: Test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/test

  # Builds the image and publishes it to GitHub Container Registry, on push to main or staging with tests passing
  docker:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # main → latest; staging → staging. The sha pins the commit (it is what the deploy uses)
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.ref == 'refs/heads/main' && 'latest' || 'staging' }}
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # On the VPS: pulls the commit's image and recreates only the API container. Only on the staging branch.
  deploy:
    needs: docker
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          API_IMAGE_TAG: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_DIR: ${{ vars.VPS_APP_DIR || '/opt/educare-api' }}
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || 22 }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: API_IMAGE_TAG,GHCR_USER,GHCR_TOKEN,APP_DIR
          script: |
            set -eu
            cd "$APP_DIR"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            export API_IMAGE_TAG
            docker compose pull api
            docker compose up -d --no-build --no-deps api
            docker logout ghcr.io

            # Waits for the image health check (readiness includes the database)
            status=unknown
            for i in $(seq 1 30); do
              status=$(docker inspect --format '{{.State.Health.Status}}' educare-api)
              echo "educare-api: $status"
              if [ "$status" = "healthy" ]; then break; fi
              sleep 5
            done
            if [ "$status" != "healthy" ]; then
              docker logs --tail 100 educare-api
              exit 1
            fi

            docker image prune -f
