services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: educare
      POSTGRES_USER: educare
      POSTGRES_PASSWORD: educare
    ports:
      - "5432:5432"
    volumes:
      - educare-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U educare -d educare"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  educare-postgres:
