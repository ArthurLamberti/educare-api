services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: educare
      POSTGRES_USER: educare
      POSTGRES_PASSWORD: educare
    ports:
      - "5432:5432"
    volumes:
      - educare-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U educare -d educare"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Catches every email sent in development: SMTP on localhost:1026, web UI on http://localhost:8026 (not the defaults, to live beside other Mailpits)
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1026:1025"
      - "8026:8025"

volumes:
  educare-postgres:
