# Production stack: Postgres, API and web. Only the web is published, on 127.0.0.1, for the host's nginx.
# Expects educare-api and educare-web cloned side by side; run from this folder:
#   docker compose --env-file .env up -d --build
name: educare

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: educare
      POSTGRES_USER: educare
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U educare -d educare"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ..
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/educare
      DB_USERNAME: educare
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      EDUCARE_JWT_SECRET: ${EDUCARE_JWT_SECRET:?set EDUCARE_JWT_SECRET}
      EDUCARE_PLATFORM_KEY: ${EDUCARE_PLATFORM_KEY:?set EDUCARE_PLATFORM_KEY}
      EDUCARE_ADMIN_EMAIL: ${EDUCARE_ADMIN_EMAIL:?set EDUCARE_ADMIN_EMAIL}
      EDUCARE_WEB_ROOT_DOMAIN: ${ROOT_DOMAIN:?set ROOT_DOMAIN}
      EDUCARE_WEB_SCHEME: https
      EDUCARE_MAIL_FROM: ${EDUCARE_MAIL_FROM:?set EDUCARE_MAIL_FROM}
      EDUCARE_MAIL_OPERATOR: ${EDUCARE_MAIL_OPERATOR:-}
      MAIL_HOST: ${MAIL_HOST:?set MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-true}
      EDUCARE_LIVEKIT_URL: ${EDUCARE_LIVEKIT_URL:-}
      EDUCARE_LIVEKIT_API_KEY: ${EDUCARE_LIVEKIT_API_KEY:-}
      EDUCARE_LIVEKIT_API_SECRET: ${EDUCARE_LIVEKIT_API_SECRET:-}

  web:
    build:
      context: ../../educare-web
      args:
        ROOT_DOMAIN: ${ROOT_DOMAIN}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_URL: http://api:8080
      ROOT_DOMAIN: ${ROOT_DOMAIN}
    ports:
      - "127.0.0.1:${WEB_PORT:-3100}:3000"

volumes:
  postgres-data:
