# /etc/nginx/sites-available/educare.conf
# The app and every school subdomain, proxied to the web container (127.0.0.1:3100).
# Needs a certificate covering educare.arthurlamberti.com and *.educare.arthurlamberti.com (see deploy/README.md).

server {
    listen 80;
    listen [::]:80;
    server_name educare.arthurlamberti.com *.educare.arthurlamberti.com;
    return 301 https://$host$request_uri;
}

server {
    # On nginx >= 1.25.1 you may write "listen 443 ssl;" plus "http2 on;" instead.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name educare.arthurlamberti.com *.educare.arthurlamberti.com;

    ssl_certificate     /etc/letsencrypt/live/educare.arthurlamberti.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/educare.arthurlamberti.com/privkey.pem;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Overwrite (not append): the web trusts the last hop for rate limits.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}
