spring:
  application:
    name: educare-api
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info

educare:
  security:
    jwt-secret: ${EDUCARE_JWT_SECRET:}
    platform-key: ${EDUCARE_PLATFORM_KEY:}
    token-ttl: 12h

---
spring:
  config:
    activate:
      on-profile: dev | test
educare:
  security:
    jwt-secret: ${EDUCARE_JWT_SECRET:dev-only-jwt-secret-not-for-production-0123456789}
    platform-key: ${EDUCARE_PLATFORM_KEY:dev-platform-key}

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/educare}
    username: ${DB_USERNAME:educare}
    password: ${DB_PASSWORD:educare}
  jpa:
    show-sql: true

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/educare}
    username: ${DB_USERNAME:educare}
    password: ${DB_PASSWORD:educare}
