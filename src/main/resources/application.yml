spring:
  application:
    name: educare-api
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info

educare:
  security:
    jwt-secret: ${EDUCARE_JWT_SECRET:}
    platform-key: ${EDUCARE_PLATFORM_KEY:}
    token-ttl: 12h
  platform:
    # System admin (operator panel), created at startup if missing; sets the password via "Esqueci a senha".
    admin-email: ${EDUCARE_ADMIN_EMAIL:arthurlamberti001@gmail.com}
    admin-name: ${EDUCARE_ADMIN_NAME:Administrador}
  web:
    root-domain: ${EDUCARE_WEB_ROOT_DOMAIN:localhost:3000}
    scheme: ${EDUCARE_WEB_SCHEME:http}
  mail:
    from: ${EDUCARE_MAIL_FROM:Educare <nao-responda@educare.localhost>}
    # Notified when a new private space waits for activation (empty = no notice).
    operator: ${EDUCARE_MAIL_OPERATOR:}

---
spring:
  config:
    activate:
      on-profile: dev | test
educare:
  security:
    jwt-secret: ${EDUCARE_JWT_SECRET:dev-only-jwt-secret-not-for-production-0123456789}
    platform-key: ${EDUCARE_PLATFORM_KEY:dev-platform-key}
  mail:
    operator: ${EDUCARE_MAIL_OPERATOR:operador@educare.localhost}

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/educare}
    username: ${DB_USERNAME:educare}
    password: ${DB_PASSWORD:educare}
  jpa:
    show-sql: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1026}

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/educare}
    username: ${DB_USERNAME:educare}
    password: ${DB_PASSWORD:educare}
