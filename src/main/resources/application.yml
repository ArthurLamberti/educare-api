spring:
  application:
    name: educare-api
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      # /actuator/health/readiness includes the database (the Docker health check uses it)
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  health:
    # SMTP down must not make the API unhealthy
    mail:
      enabled: false

educare:
  security:
    jwt-secret: ${EDUCARE_JWT_SECRET:}
    platform-key: ${EDUCARE_PLATFORM_KEY:}
    token-ttl: 12h
  platform:
    # System admin (operator panel), created at startup if missing; sets the password via "Esqueci a senha".
    # Empty (EDUCARE_ADMIN_EMAIL unset): no admin is created.
    admin-email: ${EDUCARE_ADMIN_EMAIL:}
    admin-name: ${EDUCARE_ADMIN_NAME:Administrador}
  web:
    root-domain: ${EDUCARE_WEB_ROOT_DOMAIN:localhost:3000}
    scheme: ${EDUCARE_WEB_SCHEME:http}
  mail:
    from: ${EDUCARE_MAIL_FROM:Educare <nao-responda@educare.localhost>}
    # Notified when a new private space waits for activation (empty = no notice).
    operator: ${EDUCARE_MAIL_OPERATOR:}
  virtual-room:
    # Virtual rooms of online lessons (LiveKit). Without url, key and secret, joining them answers 503.
    livekit:
      url: ${EDUCARE_LIVEKIT_URL:}
      api-key: ${EDUCARE_LIVEKIT_API_KEY:}
      api-secret: ${EDUCARE_LIVEKIT_API_SECRET:}

---
spring:
  config:
    activate:
      on-profile: dev | test
educare:
  security:
    jwt-secret: ${EDUCARE_JWT_SECRET:dev-only-jwt-secret-not-for-production-0123456789}
    platform-key: ${EDUCARE_PLATFORM_KEY:dev-platform-key}
  mail:
    operator: ${EDUCARE_MAIL_OPERATOR:operador@educare.localhost}

---
spring:
  config:
    activate:
      on-profile: test
educare:
  platform:
    admin-email: admin@educare.test

---
spring:
  config:
    activate:
      on-profile: dev
  # PostgreSQL and Mailpit for development, started by bootRun (the VPS stack is docker-compose.yml)
  docker:
    compose:
      file: docker-compose.local.yml
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/educare}
    username: ${DB_USERNAME:educare}
    password: ${DB_PASSWORD:educare}
  jpa:
    show-sql: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1026}

---
spring:
  config:
    activate:
      on-profile: prod
  # Everything comes from the environment (see deploy/.env.example); nothing secret has a default.
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:true}
